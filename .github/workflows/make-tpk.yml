name: make-typetree-tpk
on:
  workflow_dispatch:
    inputs:
      unity:
        description: "Unity version"
        required: true
        default: "2022.3.28f1"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Tpk
        uses: actions/checkout@v4
        with:
          repository: AssetRipper/Tpk

      - name: Checkout TypeTreeDumps
        uses: actions/checkout@v4
        with:
          repository: AssetRipper/TypeTreeDumps
          path: TypeTreeDumps

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish console
        shell: pwsh
        run: dotnet publish .\Tpk.ConsoleApp\Tpk.ConsoleApp.csproj -c Release -o .\out

      # Try non-brotli first (what UABEA wants), then fall back to default if flag unsupported
      - name: Pack TPK (non-brotli, preferred)
        shell: pwsh
        continue-on-error: true
        run: >
          dotnet .\out\AssetRipper.Tpk.ConsoleApp.dll pack
          --repo "$PWD\TypeTreeDumps"
          --version "${{ github.event.inputs.unity }}"
          --no-brotli
          --output "$PWD\classdata_${{ github.event.inputs.unity }}_nobrotli.tpk"

      - name: Pack TPK (fallback if needed)
        if: ${{ !hashFiles('classdata_*_nobrotli.tpk') }}
        shell: pwsh
        run: >
          dotnet .\out\AssetRipper.Tpk.ConsoleApp.dll pack
          --repo "$PWD\TypeTreeDumps"
          --version "${{ github.event.inputs.unity }}"
          --output "$PWD\classdata_${{ github.event.inputs.unity }}.tpk"

      - name: List outputs
        shell: pwsh
        run: |
          Write-Host "TPKs found under $PWD:"
          Get-ChildItem -Recurse -Filter *.tpk | Format-Table FullName,Length

      - name: Upload any TPKs
        uses: actions/upload-artifact@v4
        with:
          name: classdata-${{ github.event.inputs.unity }}
          path: |
            **\*.tpk
